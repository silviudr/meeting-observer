<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting Observer</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Meeting Observer</h1>
          <p id="statusText" role="status" aria-live="polite">No active session</p>
        </div>
        <form id="sessionForm" class="session-form">
          <label>
            Session
            <input id="sessionInput" name="session" value="demo" autocomplete="off" required maxlength="80" pattern="[A-Za-z0-9_\-]{1,80}" title="1-80 letters, digits, underscores or hyphens" />
          </label>
          <label>
            Your name in captions
            <input id="ownerInput" name="owner" autocomplete="off" maxlength="120" placeholder="As Google Meet shows it" />
          </label>
          <label>
            Access token
            <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" />
          </label>
          <button type="submit">Start / Connect</button>
          <button id="ownerApply" type="button" disabled>Set name</button>
        </form>
      </header>

      <section class="summary-strip" aria-label="Meeting summary">
        <div>
          <span class="metric" id="lineCount">0</span>
          <span class="label">Lines</span>
        </div>
        <div>
          <span class="metric" id="participantCount">0</span>
          <span class="label">Participants</span>
        </div>
        <div>
          <span class="metric" id="insightCount">0</span>
          <span class="label">Insights</span>
        </div>
      </section>

      <section class="glance" aria-labelledby="glanceHeading">
        <h2 id="glanceHeading">Needs your attention</h2>
        <p id="glanceText" class="glance-text" role="status" aria-live="polite" data-kind="none">Nothing needs your attention.</p>
        <ul id="cueList" class="cue-list"></ul>
        <p id="ownerStatus" class="owner-status">No name set. Add your caption name to track questions aimed at you.</p>
      </section>

      <section class="workspace">
        <section class="panel transcript-panel" aria-labelledby="transcriptHeading">
          <div class="panel-header">
            <h2 id="transcriptHeading">Transcript</h2>
            <button id="clearButton" type="button" disabled>End session</button>
          </div>
          <ol id="transcriptList" class="transcript-list"></ol>
        </section>

        <section class="panel insights-panel" aria-labelledby="insightsHeading">
          <div class="panel-header">
            <h2 id="insightsHeading">Coaching</h2>
            <span id="modelMode" class="model-mode">Not connected</span>
          </div>
          <p id="analysisStatus" class="analysis-status" role="status" aria-live="polite">No active analysis</p>
          <div id="insightsList" class="insights-list"></div>
        </section>
      </section>
    </main>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
