<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting Observer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <form id="settingsForm">
      <h1>Meeting Observer</h1>
      <label>
        Backend URL
        <input id="backendUrl" name="backendUrl" autocomplete="off" />
      </label>
      <label>
        Session ID
        <input id="sessionId" name="sessionId" autocomplete="off" />
      </label>
      <label>
        Access token (browser session only)
        <input id="accessToken" name="accessToken" type="password" autocomplete="off" />
      </label>
      <label class="toggle">
        <input id="captureEnabled" name="captureEnabled" type="checkbox" />
        Capture captions
      </label>
      <button id="save" type="submit">Apply</button>
      <p id="status" role="status" aria-live="polite">Paused</p>
      <a id="dashboard" href="http://localhost:8010/" target="_blank" rel="noopener noreferrer">Open dashboard</a>
    </form>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
